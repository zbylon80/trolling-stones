name: Deploy redesign preview

on:
  push:
    branches: [ "redesign" ]
  workflow_dispatch:

concurrency:
  group: preview-redesign
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/redesign'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify isolated preview paths
        run: npm run test:preview

      - name: Build isolated preview
        run: npm run build:preview

      - name: Publish to dedicated preview directory
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.TS_FTP_HOST || secrets.EI_FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.TS_FTP_USERNAME || secrets.EI_FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.TS_FTP_PASSWORD || secrets.EI_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ format('{0}preview-redesign/', endsWith((secrets.TS_FTP_DIR || secrets.EI_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR), '/') && (secrets.TS_FTP_DIR || secrets.EI_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR) || format('{0}/', (secrets.TS_FTP_DIR || secrets.EI_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR))) }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.astro/**

      - name: Preview URL
        run: echo "Preview published at https://trollingstones.pl/preview-redesign/"
