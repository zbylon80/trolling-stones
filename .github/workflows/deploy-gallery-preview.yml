name: Deploy gallery preview

on:
  push:
    branches: [ "codex/gallery-photos" ]

concurrency:
  group: preview-gallery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-gallery-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/gallery-photos'
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE_PATH: /preview-gallery/
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build isolated gallery preview
        run: npm run build:preview

      - name: Verify preview paths, captions and assets
        run: node --test tests/preview-build.test.mjs tests/gallery-preview-build.test.mjs

      - name: Publish only to preview-gallery
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.TS_FTP_HOST || secrets.EI_FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.TS_FTP_USERNAME || secrets.EI_FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.TS_FTP_PASSWORD || secrets.EI_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ format('{0}preview-gallery/', endsWith((secrets.TS_FTP_DIR || secrets.EI_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR), '/') && (secrets.TS_FTP_DIR || secrets.EI_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR) || format('{0}/', (secrets.TS_FTP_DIR || secrets.EI_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR))) }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.astro/**
            images/send/**
